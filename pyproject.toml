[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "globalpulse"
version = "1.0.0"
description = "Modelado Estadístico e Inferencia Bayesiana para la Movilidad Insular en Gran Canaria (Guaguas Global) - TFG ULPGC"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Estudiante ULPGC", email = "contacto@ulpgc.es" }
]
dependencies = [
    "numpy>=2.0.0",
    "pandas>=2.0.0",
    "scipy>=1.14.0",
    "scikit-learn>=1.5.0",
    "statsmodels>=0.14.0",
    "networkx>=3.0",
    "pgmpy>=1.1.0",
    "streamlit>=1.35.0",
    "plotly>=5.20.0",
    "pydeck>=0.9.0",
    "tabulate>=0.9.0",
    "pytest>=8.0.0"
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
